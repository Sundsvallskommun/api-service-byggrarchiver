openapi:
  description: '@project.description@'
  name: ${spring.application.name}
  title: ByggR Archiver
  version: '@project.version@'
resilience4j.circuitbreaker:
  instances:
    archive:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
      # Archive returns 500 (should be 422) for per-document content/format rejection - a business
      # condition, not an outage. Don't let it open the breaker. Remove when Archive returns 4xx.
      ignore-exception-predicate: se.sundsvall.byggrarchiver.integration.archive.ArchiveFormatRejectionPredicate
    messaging:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
    arendeExport:
      # A SOAP fault means ByggR answered (e.g. "Item not found") - a business condition, not an outage.
      # Don't let it open the breaker. Real unavailability surfaces as connection/timeout errors, which still count.
      ignore-exceptions:
        - jakarta.xml.ws.soap.SOAPFaultException
resilience4j.retry:
  instances:
    archive:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
      # Retrying a deterministic format rejection never succeeds and re-uploads the payload each attempt. See breaker note.
      ignore-exception-predicate: se.sundsvall.byggrarchiver.integration.archive.ArchiveFormatRejectionPredicate
    messaging:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
spring:
  application:
    name: api-byggrarchiver
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  cloud:
    openfeign:
      client:
        config:
          # No Feign/Logbook logging towards ByggR and Archive. Logbook buffers the whole body and runs its body filters
          # on it, which for base64-encoded documents costs ~15x the file size in heap (OOM on documents of ~50 MB).
          # ArendeExportIntegration and ArchiveIntegration log the calls instead.
          arendeExport:
            logger-level: none
          archive:
            logger-level: none
# NOTE: do NOT set logbook.logs.maxBodySizeToLog. dept44 registers truncate() before its body filters, so a body larger
# than the limit is cut into malformed JSON and the filters (e.g. password masking) silently stop redacting.
scheduler:
  name: archive
  cron:
    expression: '-'
  shedlock-lock-at-most-for: PT2M
  maximum-execution-time: PT2M
